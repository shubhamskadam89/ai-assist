spring.application.name=aiassist

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/codementor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


ai.mode=LLM
gemini.api.key=${GEMINI_API_KEY:none}

# Ollama / AI Provider Configuration
ai.ollama.url=http://localhost:11434/api/generate
ai.ollama.model=phi3

# JWT Configuration
jwt.secret=CodeMentorSecretKeyForJWTSigning2024CollegeEditionSecure
jwt.expiration=86400000
