spring.application.name=ai_assist_backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/codementor
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


ai.mode=RULE
gemini.api.key=${GEMINI_API_KEY}

# Ollama / AI Provider Configuration
ai.ollama.url=http://localhost:11434/api/generate
ai.ollama.model=qwen3-coder:480b-cloud
